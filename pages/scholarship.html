<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../assets/css/style.css">

<body>

    <header class="navbar">
        <div class="logo">
            GSH
        </div>

        <a href="../index.html" class="back-btn">
            返回首页
        </a>
    </header>

    <section class="page-header">
        <h1>奖助评优</h1>

        <p>
            集中整理奖学金、助学金、荣誉评选等研究生常用事项。
        </p>
    </section>

    <section class="service-grid">
        <div class="service-card">
            <h3>奖学金申请</h3>
            <p>查看奖学金申请条件、时间安排与材料要求。</p>
        </div>

        <div class="service-card">
            <h3>助学金说明</h3>
            <p>了解助学金发放、资格确认和变更说明。</p>
        </div>

        <div class="service-card">
            <h3>评优评先</h3>
            <p>查看优秀研究生、优秀学生干部等评选要求。</p>
        </div>
    </section>

    <section class="content-section">
        <h2>办理提示</h2>

        <ol>
            <li>先确认通知中的申报对象、截止时间和材料清单。</li>
            <li>按要求准备申请表、佐证材料和导师意见。</li>
            <li>提交后关注学院或年级群内的后续审核通知。</li>
        </ol>
    </section>
