name = "qiqida-stats-worker"
main = "src/index.ts"
compatibility_date = "2024-07-01"

[[d1_databases]]
binding = "DB"
database_name = "feedback_db"
database_id = "c3ae52f4-41bf-4b2b-afe7-c9c29888152a"

# 迁移文件目录。
# wrangler d1 migrations apply 会读这个目录，
# 按文件名顺序执行还没跑过的 .sql 文件。
migrations_dir = "migrations"

[vars]
GITHUB_REPO = "qiqida/qiqida.github.io"
GITHUB_BRANCH = "main"
CACHE_TTL = "300"
GA_ENABLED = "true"

# 管理员密钥（请在 Cloudflare Dashboard 中设置为 secrets）
# ADMIN_KEY = "your-secret-key"
