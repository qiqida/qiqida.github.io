<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 - 七七哒</title>
    <style>
        :root {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: rgba(0, 0, 0, 0.08);
            --accent: #007aff;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --text-primary: #f5f5f7;
            --text-secondary: #98989d;
            --border-color: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(28, 28, 30, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 登录页 */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-box p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: var(--accent);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--text-primary);
            color: var(--bg-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* 管理页 */
        .admin-container {
            display: none;
        }

        .admin-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-header-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title {
            font-size: 18px;
            font-weight: 600;
        }

        .logout-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: var(--bg-secondary);
        }

        /* 筛选标签 */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            padding: 0 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-tab {
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .filter-tab .count {
            margin-left: 6px;
            opacity: 0.7;
        }

        /* 留言列表 */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .message-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-name {
            font-weight: 600;
            font-size: 15px;
        }

        .message-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .message-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: rgba(255, 149, 0, 0.15);
            color: var(--warning);
        }

        .status-approved {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }

        .status-rejected {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
        }

        .message-content {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-secondary);
        }

        .action-btn.approve {
            color: var(--success);
            border-color: var(--success);
        }

        .action-btn.approve:hover {
            background: rgba(52, 199, 89, 0.1);
        }

        .action-btn.reject {
            color: var(--danger);
            border-color: var(--danger);
        }

        .action-btn.reject:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            padding: 20px 0;
        }

        .page-btn {
            padding: 10px 18px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 加载状态 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 详情弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow: auto;
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
        }

        .detail-item {
            margin-bottom: 16px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 15px;
        }

        .detail-content {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s;
            max-width: 80%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        [data-theme="dark"] .toast {
            background: rgba(255, 255, 255, 0.9);
            color: #1d1d1f;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .login-box {
                padding: 32px 24px;
            }

            .message-card {
                padding: 16px;
            }

            .message-actions {
                flex-wrap: wrap;
            }

            .action-btn {
                flex: 1 1 calc(50% - 4px);
            }
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>留言管理</h1>
            <p>请输入管理员密钥登录</p>
            <input type="password" id="adminKey" class="login-input" placeholder="输入管理员密钥">
            <button id="loginBtn" class="login-btn">登录</button>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <!-- 管理页 -->
    <div id="adminPage" class="admin-container">
        <header class="admin-header">
            <div class="admin-header-inner">
                <h1 class="admin-title">留言管理</h1>
                <button id="logoutBtn" class="logout-btn">退出登录</button>
            </div>
        </header>

        <div class="container">
            <div class="filter-tabs">
                <button class="filter-tab active" data-status="pending">待处理 <span class="count" id="pendingCount">0</span></button>
                <button class="filter-tab" data-status="approved">已通过 <span class="count" id="approvedCount">0</span></button>
                <button class="filter-tab" data-status="rejected">已拒绝 <span class="count" id="rejectedCount">0</span></button>
                <button class="filter-tab" data-status="all">全部</button>
            </div>

            <div id="messageList" class="message-list">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <span>加载中...</span>
                </div>
            </div>

            <div id="pagination" class="pagination" style="display: none;">
                <button id="prevBtn" class="page-btn">上一页</button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button id="nextBtn" class="page-btn">下一页</button>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>留言详情</h3>
                <button class="modal-close" id="closeModal">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = 'https://qiqida-stats-worker.dddhui-qi.workers.dev';
        let adminKey = localStorage.getItem('adminKey') || '';
        let currentStatus = 'pending';
        let currentPage = 1;
        let totalItems = 0;
        let limit = 20;

        // 主题检测
        function detectTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        // Toast 提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 登录验证
        async function verifyKey(key) {
            try {
                const res = await fetch(`${API_BASE}/feedback?status=pending&limit=1`, {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                return res.status !== 401;
            } catch {
                return false;
            }
        }

        // 登录
        async function login() {
            const key = document.getElementById('adminKey').value.trim();
            if (!key) {
                document.getElementById('loginError').textContent = '请输入密钥';
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '验证中...';

            const valid = await verifyKey(key);
            if (valid) {
                adminKey = key;
                localStorage.setItem('adminKey', key);
                showAdminPage();
            } else {
                document.getElementById('loginError').textContent = '密钥无效';
                document.getElementById('loginError').style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = '登录';
        }

        // 登出
        function logout() {
            adminKey = '';
            localStorage.removeItem('adminKey');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminPage').style.display = 'none';
        }

        // 显示管理页
        function showAdminPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            loadMessages();
        }

        // API 请求
        async function fetchMessages(status, page) {
            const offset = (page - 1) * limit;
            const url = status === 'all'
                ? `${API_BASE}/feedback?limit=${limit}&offset=${offset}&status=pending`
                : `${API_BASE}/feedback?status=${status}&limit=${limit}&offset=${offset}`;

            const res = await fetch(url, {
                headers: { 'Authorization': `Bearer ${adminKey}` }
            });

            if (res.status === 401) {
                logout();
                showToast('登录已过期，请重新登录');
                return null;
            }

            return await res.json();
        }

        // 加载留言
        async function loadMessages() {
            const listEl = document.getElementById('messageList');
            listEl.innerHTML = '<div class="loading"><div class="loading-spinner"></div><span>加载中...</span></div>';

            const data = await fetchMessages(currentStatus, currentPage);
            if (!data) return;

            if (data.messages && data.messages.length > 0) {
                renderMessages(data.messages);
                totalItems = data.total;
                updatePagination();
            } else {
                listEl.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg><p>暂无留言</p></div>';
                document.getElementById('pagination').style.display = 'none';
            }
        }

        // 渲染留言列表
        function renderMessages(messages) {
            const listEl = document.getElementById('messageList');
            listEl.innerHTML = messages.map(msg => `
                <div class="message-card" data-id="${msg.id}">
                    <div class="message-header">
                        <div class="message-meta">
                            <span class="message-name">${escapeHtml(msg.name || '匿名用户')}</span>
                            <span class="message-time">${formatTime(msg.created_at)}</span>
                        </div>
                        <span class="message-status status-${msg.status}">${statusText(msg.status)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                    <div class="message-actions">
                        <button class="action-btn" onclick="showDetail(${msg.id})">查看详情</button>
                        <button class="action-btn approve" onclick="updateStatus(${msg.id}, 'approved')">通过</button>
                        <button class="action-btn reject" onclick="updateStatus(${msg.id}, 'rejected')">拒绝</button>
                    </div>
                </div>
            `).join('');
        }

        // 更新状态
        async function updateStatus(id, status) {
            const res = await fetch(`${API_BASE}/feedback/update`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${adminKey}`
                },
                body: JSON.stringify({ id, status })
            });

            if (res.ok) {
                showToast(status === 'approved' ? '已通过' : '已拒绝');
                loadMessages();
            } else {
                showToast('操作失败');
            }
        }

        // 查看详情
        async function showDetail(id) {
            const data = await fetchMessages(currentStatus, currentPage);
            if (!data) return;

            const msg = data.messages.find(m => m.id === id);
            if (!msg) return;

            document.getElementById('modalBody').innerHTML = `
                <div class="detail-item">
                    <div class="detail-label">ID</div>
                    <div class="detail-value">#${msg.id}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">姓名</div>
                    <div class="detail-value">${escapeHtml(msg.name || '匿名用户')}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">状态</div>
                    <div class="detail-value"><span class="message-status status-${msg.status}">${statusText(msg.status)}</span></div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">时间</div>
                    <div class="detail-value">${formatTime(msg.created_at)}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">内容</div>
                    <div class="detail-content">${escapeHtml(msg.content)}</div>
                </div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        // 分页更新
        function updatePagination() {
            const totalPages = Math.ceil(totalItems / limit);
            document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
        }

        // 工具函数
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function pad(n) {
            return n.toString().padStart(2, '0');
        }

        function statusText(status) {
            const map = { pending: '待处理', approved: '已通过', rejected: '已拒绝' };
            return map[status] || status;
        }

        // 事件绑定
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('adminKey').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('detailModal').classList.remove('active');
        });
        document.getElementById('detailModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) {
                e.currentTarget.classList.remove('active');
            }
        });

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentStatus = tab.dataset.status;
                currentPage = 1;
                loadMessages();
            });
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadMessages();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentPage++;
            loadMessages();
        });

        // 初始化
        detectTheme();
        if (adminKey) {
            showAdminPage();
        }
    </script>
</body>
</html>
